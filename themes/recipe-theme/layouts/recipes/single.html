<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="{{ "css/global.css" | relURL }}">
    <link rel="stylesheet" href="{{ "css/recipe.css" | relURL }}">
    <script src="{{ "js/checkboxes.js" | absURL }}" defer></script>
    <script src="{{ "js/adjust-quantities.js" | absURL }}"></script>
    <script src="{{ "js/wake-lock.js" | absURL }}" defer></script>
</head>
<body>
<div class="container">
    <button class="secondary-button" onclick="window.location.href='{{ .Site.BaseURL | relURL }}'">← Zurück zu Rezepten</button>

    <h1 class="title">{{ .Title }}</h1>
    {{ $dim := images.Config (printf "static/%s" .Params.image) }}
    <img src="{{ .Params.image | absURL }}" alt="{{ .Title }}" width="{{ $dim.Width }}" height="{{ $dim.Height }}" fetchpriority="high">
    <p> {{ .RawSummary }} </p>

    <h1>Portionen</h1>
    <div id="portionControl" data-baseline-portions="{{ .Params.portions | default 2 }}">
        <button id="decreasePortion" class="quantity-button">➖</button>
        <span id="portionDisplay"></span>
        <button id="increasePortion" class="quantity-button">➕</button>
    </div>

    <div>
        {{ .Content | safeHTML }}
    </div>
</div>
</body>
</html>
